# SonarQube scanner configuration for Tovu.
#
# Run from the REPO ROOT (not this directory):
#   sonar-scanner -Dproject.settings=development/sonarqube/sonar-project.properties
# or use development/sonarqube/scan.sh, which does this for you.
#
# See development/sonarqube/README.md for the reasoning behind every non-obvious choice below
# (module layout, coverage-path rewrite, complexity-ceiling reconciliation, blocking-vs-reporting).

sonar.projectKey=tovu
sonar.projectName=Tovu
# Bump only when you intentionally want scan history to reset.
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ---- Module layout ----
# Verified on disk 2026-08-29: there is NO root `src/` in this repo (an earlier assumption that one
# exists was wrong). First-party application/tooling code lives in these four trees:
#   apps/website/src    - the Tovu server + CLI (Node/TS)
#   apps/admin/src       - the admin SPA (React/TS, own package.json + vite)
#   apps/site-chat/src   - the embeddable site-chat widget (React/TS, own package.json + vite)
#   packages/sdk/src     - the SDK package
#   development/scripts  - first-party build/check tooling (TS + one Python file), not vendored
# Tests are colocated (each tree has its own __tests__/ dirs) rather than split out, so sonar.tests
# is left unset — sonar.test.inclusions below reclassifies matching files as tests in place.
sonar.sources=apps/website/src,apps/admin/src,apps/site-chat/src,packages/sdk/src,development/scripts
sonar.test.inclusions=**/__tests__/**,**/__measurements__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ---- Exclusions ----
# Mirrors eslint.config.mjs's own ignore list where it overlaps (node_modules, dist, build,
# coverage, AI-Dev-Shop, ADS-memory, apps/admin/dist-debug, .claude worktrees) plus this repo's
# other non-code trees confirmed on disk: generated OpenAPI specs, vendored/marketplace theme
# content, and per-site runtime data.
sonar.exclusions=**/node_modules/**,**/dist/**,apps/admin/dist-debug/**,**/build/**,**/coverage/**,\
AI-Dev-Shop/**,ADS-memory/**,.playwright-mcp/**,.claude/**,content/**,sites/**,openapi/**,\
development/coverage/**,development/playwright-report/**,apps/admin/.certs.disabled/**,**/*.snap

# Coverage on test files themselves isn't meaningful.
sonar.coverage.exclusions=**/__tests__/**,**/__measurements__/**,**/*.test.ts,**/*.test.tsx

# ---- Coverage ----
# development/coverage/lcov.info (from `npm run test:cov`, root-relative SF: paths — matches
# sonar.sources directly) covers apps/website + packages/* + apps/site-chat.
#
# apps/admin's own lcov (apps/admin/coverage/lcov.info, from `npm --prefix apps/admin run test:cov`)
# uses SF: paths relative to apps/admin/ (e.g. `SF:src/features/...`), NOT the repo root this scan
# is rooted at — pointing Sonar at it directly would silently import zero coverage for admin, since
# `src/features/...` doesn't exist at the repo root. scan.sh rewrites a copy with the `apps/admin/`
# prefix restored into development/sonarqube/.generated/admin-lcov.info before every scan; that
# generated file (never the original) is what's referenced here.
#
# Both source lcov files were 8+ days stale and admin's had only one test file's worth of data as
# of 2026-08-29 (verified: `apps/admin/coverage/lcov.info` was 242 bytes, one SF: entry). Root's
# lcov.info also carries ~1800 `../Jini/...` entries from this repo's `file:../Jini/packages/*`
# sibling dependency — Node's coverage instrumentation records every module actually loaded,
# including sibling packages. Sonar skips SF: paths it can't resolve under sonar.sources, so those
# entries are harmless noise, not a blocker — but they mean the coverage numbers you see on a scan
# run against stale lcov are NOT current. Run `npm run test:cov` (and, for admin coverage,
# `npm --prefix apps/admin run test:cov`) immediately before a scan you intend to trust.
sonar.javascript.lcov.reportPaths=development/coverage/lcov.info,development/sonarqube/.generated/admin-lcov.info

# ---- Quality gate ----
# Deliberately NOT blocking. See README.md's "Blocks vs reports" section for the reasoning
# (mirrors this repo's own check:architecture precedent: accountability over a green gate).
# scan.sh passes -Dsonar.qualitygate.wait=false explicitly so a scan never fails the shell exit
# code on gate status; treat the SonarQube web UI as a dashboard to triage, not a merge blocker.
