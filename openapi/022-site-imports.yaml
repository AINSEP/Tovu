openapi: 3.0.3
info:
  title: Tovu site import history
  version: 1.0.0
paths:
  /api/admin/v1/workspaces/{workspaceId}/site-imports:
    get:
      summary: List the authenticated principal's private imports
      description: Requires system.read, including grant-aware authorization. Authorization and workspace availability precede cursor validation. All outcomes carry no-store, nosniff, noindex/no-follow and no-referrer headers.
      security:
        - session: []
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          required: false
          description: nextCursor from the previous page; no other query keys are accepted.
          schema: { type: string, minLength: 1, maxLength: 96, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: Up to 50 imports, newest timestamp and import ID first
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items:
                      type: object
                      required: [importId, source, newSiteId, newSiteName, state, status, createdAt, credentialWarnings, instructions]
                      properties:
                        importId: { type: string, format: uuid }
                        source:
                          oneOf:
                            - type: object
                              required: [url]
                              properties: { url: { type: string } }
                            - type: object
                              required: [uploadId]
                              properties: { uploadId: { type: string, format: uuid } }
                        newSiteId: { type: string, nullable: true }
                        newSiteName: { type: string, nullable: true }
                        state: { type: string, enum: [verifying, needs-owner, creating, ready, failed] }
                        status: { type: string, enum: [verifying, needs-owner, creating, ready, failed] }
                        createdAt: { type: string, format: date-time }
                        warnings: { type: array, items: { type: string } }
                        credentialWarnings:
                          type: array
                          items:
                            type: object
                            required: [path, kind]
                            properties: { path: { type: string }, kind: { type: string } }
                        setupUrl: { type: string }
                        adminUrl: { type: string, nullable: true }
                        hasEncryptedKeys: { type: boolean }
                        error: { type: string }
                        instructions: { type: string }
                  nextCursor: { type: string, maxLength: 96 }
        '400':
          description: Invalid cursor or query shape
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [INVALID_CURSOR] }
                  message: { type: string, enum: ['Import history failed: This list of imports changed. Reload it to see the newest imports.'] }
        '401':
          description: Authentication required
        '403':
          description: system.read refused
        '404':
          description: Workspace unavailable; NOT_FOUND with fixed Import history failed copy
        '503':
          description: Backend unavailable (UNAVAILABLE), or busy, damaged or newer history with a correlated errorId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryFailure' }
        '507':
          description: Insufficient storage; safe message with a correlated errorId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryFailure' }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: session }
  schemas:
    HistoryFailure:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        errorId: { type: string }
