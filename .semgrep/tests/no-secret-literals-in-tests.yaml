rules:
  - id: no-secret-literals-in-tests
    languages: [typescript, javascript]
    severity: ERROR
    message: Build synthetic credential fixtures at runtime from separate pieces; never embed a secret-shaped literal.
    paths:
      include:
        - '**/*.test.*'
        - '**/*.spec.*'
        - '**/__tests__/**'
        - '**/tests/**'
        - '**/test/**'
    options:
      constant_propagation: false
    patterns:
      - pattern: '"$SECRET"'
      - metavariable-regex:
          metavariable: $SECRET
          regex: '(?s).*(?:ghp_|github_pat_|sk-|AKIA|xox[bp]-)[A-Za-z0-9_-]+'
