<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Same disclosed limitation blog-post.html carries: a static theme's <title> is one fixed string
     per file. The real post title still renders in the <h1> via the post-content embed below; only
     the browser-tab/SEO title stays generic here. -->
<title>Documentation — Basic</title>
<link rel="stylesheet" href="../css/styles.css" />
<script src="../js/theme-toggle.js"></script>
</head>
<body>

<div data-tovu-slot="nav" data-nav-current="docs"></div>

<main>
  <div class="docs-layout wrap">
    <!-- The sidebar is theme markup + CSS; the only thing resolved at request time is the menu
         inside it. `data-embed-variant="tree"` opts this one marker into nested <ul>/<li> rendering
         (see static-render.ts::renderMenuTree) — the default flat <a> output is what every other
         marker in this theme still gets, because .main-nav's flex layout depends on it.

         The authored content below is a real fallback, not a placeholder: if `docs-themes-menu`
         does not exist yet, or resolves to zero renderable links, this markup is left exactly as-is
         rather than blanked. -->
    <aside class="docs-sidebar">
      <nav class="docs-nav" aria-label="Documentation" data-embed-type="menu" data-embed-id="docs-themes-menu" data-embed-variant="tree">
        <ul class="menu-list depth-0">
          <li class="menu-item depth-0"><span class="menu-item-label">No docs menu bound yet</span></li>
        </ul>
      </nav>
    </aside>

    <article class="docs-content post-detail" data-reveal>
      <div data-embed-type="post" data-embed-id="{{post}}"></div>
    </article>
  </div>
</main>

<div data-tovu-slot="footer"></div>

<script src="../js/main.js"></script>
<script src="../js/vendor/motion.js"></script>
<script src="../js/reveal.js"></script>
<script src="../js/docs-sidebar.js"></script>
</body>
</html>
