<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Basic</title>
<style>
:root {
  --bg: oklch(9% 0.004 250);
  --surface: oklch(12% 0.005 250);
  --surface-2: oklch(15% 0.006 250);
  --fg: oklch(96% 0.003 250);
  --muted: oklch(65% 0.012 250);
  --border: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.16);
  --accent: oklch(72% 0.17 152);
  --accent-fg: oklch(14% 0.03 152);
  --font-display: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  --font-body: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace;
  --container: 1120px;
}
:root[data-theme="light"] {
  --bg: #f6f9f8;
  --surface: #f1f4f2;
  --surface-2: #e8ece9;
  --fg: #09140f;
  --muted: #4b5952;
  --border: rgba(9,20,15,0.10);
  --border-strong: rgba(9,20,15,0.18);
  --accent: #22c373;
  --accent-fg: #f8fbf9;
  --font-display: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  --font-body: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace;
  --container: 1120px;
}
</style>
<link rel="stylesheet" href="css/styles.css" />
<script src="js/theme-toggle.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Basic
    </a>
    <nav class="main-nav">
      <a href="pricing.html" data-nav-id="pricing">Pricing</a>
      <a href="docs.html" data-nav-id="docs">Docs</a>
      <a href="blog.html" data-nav-id="blog">Blog</a>
      <a href="changelog.html" data-nav-id="changelog">Changelog</a>
      <a href="about.html" data-nav-id="about">About</a>
      <a href="download.html" data-nav-id="download">Download</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" type="button" aria-label="Switch to light mode" data-theme-toggle>
        <span class="icon-stack">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M3 12h2.2M18.8 12H21M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        </span>
      </button>
      <button class="nav-toggle btn btn-ghost" aria-expanded="false" aria-label="Toggle menu">Menu</button>
      <a href="signin.html" class="btn btn-ghost">Sign in</a>
      <a href="signup.html" class="btn btn-solid">Get started</a>
    </div>
  </div>
</header>


<main class="auth-wrap" data-reveal>
  <h1>Welcome back</h1>
  <p class="lede">Sign in to your Basic dashboard.</p>

  <form onsubmit="return false;">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn btn-solid btn-block btn-lg" style="margin-top: 8px;">Sign in</button>
  </form>

  <div class="divider">or</div>
  <button type="button" class="btn btn-ghost btn-block">Continue with GitHub</button>

  <p class="auth-foot">Don't have an account? <a href="signup.html">Get started</a></p>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none; padding-top:0;">
      <span>© 2026 Basic. All rights reserved.</span>
      <span>A Tovu theme, adapted from an original Open Design export</span>
    </div>
  </div>
</footer>


<script src="js/main.js"></script>
<script src="js/vendor/motion.js"></script>
<script src="js/reveal.js"></script>
</body>
</html>
