<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Known limitation, disclosed not silent: a static theme's <title> is one fixed string per
     file — there is no per-post templating mechanism for it (data-embed-type only substitutes a
     <div>'s content, never a page's own <head>). A real post's title still renders in the <h1>
     below via the post-content embed; only the browser-tab/SEO title stays generic here. -->
<title>Blog post — Basic</title>
<link rel="stylesheet" href="../css/styles.css" />
<script src="../js/theme-toggle.js"></script>
</head>
<body>

<div data-embed-config='{"type":"partial","id":"nav","current":"blog"}'></div>

<main>
  <article class="post-detail wrap" data-reveal>
    <div data-embed-config='{"type":"post","id":"{{post}}"}'></div>
  </article>
</main>

<div data-embed-config='{"type":"partial","id":"footer"}'></div>

<script src="../js/main.js"></script>
<script src="../js/vendor/motion.js"></script>
<script src="../js/reveal.js"></script>
</body>
</html>
