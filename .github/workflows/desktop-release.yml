name: Desktop Release

# Cuts a Tovu Desktop release build. STANDALONE: this workflow does not touch `ci.yml` or
# `desktop.yml`, does not re-enable either of them, and shares no jobs with them. It only
# triggers on `workflow_dispatch` or a `desktop-v*` tag push — no `pull_request` and no
# `pull_request_target` — so a fork can never reach its secrets.
#
# Secrets (all five live in the `desktop-release` GitHub Actions environment, Mac jobs only):
#   CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER
# See `apps/desktop/RELEASING.md` for where each one already lives and how to find it again —
# do not create new ones; that doc explains why and where electron-builder skips notarization
# SILENTLY if one of the five is empty (the preflight step below exists to fail loud instead).
#
# Owner's publish step: this workflow only ever creates/updates a DRAFT release (`gh release
# create --draft` / `gh release upload --clobber`). Nothing here publishes it. A human downloads
# the draft's artifacts, smoke-tests them, and clicks Publish by hand — see
# `apps/desktop/RELEASING.md` ("How a release is cut") for the full sequence, including why the
# stable `releases/latest/download/...` URLs stay 404 until that publish click happens.
#
# win-x64 (S6): unsigned. Windows code signing is not wired up (no CSC_LINK/CSC_KEY_PASSWORD for
# this OS — see the `electron-builder` step's env below), and the draft release's notes say so.
# `electron-builder.yml`'s `nsis.artifactName` resolves to `Tovu-windows-x64-setup.exe`, matching
# both this matrix row's `out:` and the `release` job's fallback `gh release create` line.
#
# `uses:` steps are pinned to commit SHAs (resolved from each action's `v4` tag on 2026-09-23),
# not floating version tags.

on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. desktop-v0.1.0", required: true, type: string }
  push:
    tags: ["desktop-v*"]
permissions: { contents: read }
concurrency: { group: "desktop-release-${{ github.ref }}", cancel-in-progress: false }
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gates:                                   # gates run on Linux only, once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: "package-lock.json\napps/desktop/package-lock.json" }
      # `npm run build` at the root: the desktop suite's initSiteDir integration test spawns Tovu's
      # real CLI (`bin.tovu` -> dist/src/cli/main.js), which a fresh checkout does not have.
      # vendored Jini: unpublished Jini APIs Tovu needs (see vendor/jini/README.md). --no-save keeps
      # the lockfile; installed after `npm ci` so the tarballs replace the registry copies.
      - run: npm ci && npm install --no-save --no-audit --no-fund ./vendor/jini/*.tgz && npm run build && npm ci --prefix apps/desktop
      - run: npm run gates
        working-directory: apps/desktop
      - name: Tag matches desktop version
        run: test "$TAG" = "desktop-v$(node -p "require('./apps/desktop/package.json').version")"

  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac-arm64, os: macos-15,       arch: arm64, eb: "--mac --arm64", out: "Tovu-mac-arm64.dmg",       asar: "release/mac-arm64/Tovu.app/Contents/Resources/app.asar", app: "release/mac-arm64/Tovu.app", lipo: arm64 }
          - { id: mac-x64,   os: macos-15-intel, arch: x64,   eb: "--mac --x64",   out: "Tovu-mac-x64.dmg",         asar: "release/mac/Tovu.app/Contents/Resources/app.asar",       app: "release/mac/Tovu.app",       lipo: x86_64 }
          # win-x64 is unsigned (no CSC_LINK/CSC_KEY_PASSWORD on Windows — see the `electron-builder`
          # step's env below); the draft release's notes already say so.
          - { id: win-x64,   os: windows-2025,   arch: x64,   eb: "--win --x64",   out: "Tovu-windows-x64-setup.exe", asar: "release/win-unpacked/resources/app.asar" }
    runs-on: ${{ matrix.os }}
    environment: desktop-release           # secrets live here; optional required reviewer
    defaults: { run: { shell: bash } }
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true                      # long paths on the Windows runner
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - if: runner.os == 'Windows'
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"   # npm scripts assume bash
      - name: Runner arch is the target arch (never cross-build)
        run: test "$(node -p process.arch)" = "${{ matrix.arch }}"
      - name: Build Tovu payload inputs
        run: |
          npm ci && npm install --no-save --no-audit --no-fund ./vendor/jini/*.tgz && npm run build   # vendored Jini
          (cd apps/admin && npm ci && npm install --no-save --no-audit --no-fund ../../vendor/jini/*.tgz && npx vite build)
          (cd apps/site-chat && npm ci && npx vite build)
          npm ci --prefix apps/desktop
      - name: Build + stage desktop
        working-directory: apps/desktop
        run: npm run build && TOVU_TARGET_ARCH=${{ matrix.arch }} npm run stage
      - if: runner.os == 'macOS'
        name: Preflight signing + notarization secrets (electron-builder skips SILENTLY)
        env: { CSC_LINK: "${{ secrets.CSC_LINK }}", CSC_KEY_PASSWORD: "${{ secrets.CSC_KEY_PASSWORD }}", P8: "${{ secrets.APPLE_API_KEY_P8 }}", KID: "${{ secrets.APPLE_API_KEY_ID }}", ISS: "${{ secrets.APPLE_API_ISSUER }}" }
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD P8 KID ISS; do test -n "${!v}" || { echo "missing $v"; exit 1; }; done
          printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: electron-builder
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'Windows' && 'false' || 'true' }}
        run: npx electron-builder ${{ matrix.eb }} --publish never
      - name: verify-package (unpacked build)
        working-directory: apps/desktop
        run: node scripts/verify-package.ts --asar "${{ matrix.asar }}"
      - name: Native-module smoke (runs the shipped binary on this CPU)
        working-directory: apps/desktop
        run: node scripts/smoke-native.ts --platform-dir release
      - if: runner.os == 'macOS'
        name: App is signed, notarized, stapled, right arch
        working-directory: apps/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 "${{ matrix.app }}"
          # Captured, not piped: `grep -q` exiting early can SIGPIPE a `tee` under pipefail. A non-zero
          # spctl fails the assignment itself under `bash -e`.
          out="$(spctl -a -vv -t exec "${{ matrix.app }}" 2>&1)"; echo "$out"
          grep -q "source=Notarized Developer ID" <<<"$out"
          xcrun stapler validate "${{ matrix.app }}"
          test "$(lipo -archs "${{ matrix.app }}/Contents/MacOS/Tovu")" = "${{ matrix.lipo }}"
      - if: runner.os == 'macOS'
        name: Notarize + staple the dmg itself
        working-directory: apps/desktop/release
        env: { KID: "${{ secrets.APPLE_API_KEY_ID }}", ISS: "${{ secrets.APPLE_API_ISSUER }}" }
        # `notarytool submit --wait` can exit 0 on an `Invalid` submission, so its exit code is not
        # the verdict: the stapled ticket (`stapler validate`) and spctl's `source=` line are.
        run: |
          xcrun notarytool submit "${{ matrix.out }}" --key "$APPLE_API_KEY" --key-id "$KID" --issuer "$ISS" --wait
          xcrun stapler staple "${{ matrix.out }}"
          xcrun stapler validate "${{ matrix.out }}"
          out="$(spctl -a -vv -t open --context context:primary-signature "${{ matrix.out }}" 2>&1)"; echo "$out"
          grep -q "source=Notarized Developer ID" <<<"$out"
      - if: always() && runner.os == 'macOS'
        name: Remove the App Store Connect key file
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - if: runner.os == 'macOS'
        name: verify-package on the SHIPPED dmg
        working-directory: apps/desktop
        run: |
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "release/${{ matrix.out }}"
          node scripts/verify-package.ts --asar "$RUNNER_TEMP/dmg/Tovu.app/Contents/Resources/app.asar"
          test "$(lipo -archs "$RUNNER_TEMP/dmg/Tovu.app/Contents/MacOS/Tovu")" = "${{ matrix.lipo }}"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - if: runner.os == 'Windows'
        name: verify-package on the SHIPPED installer
        working-directory: apps/desktop
        run: |
          7z x "release/${{ matrix.out }}" -o"$RUNNER_TEMP/nsis" -y
          7z x "$RUNNER_TEMP/nsis/\$PLUGINSDIR/app-64.7z" -o"$RUNNER_TEMP/app" -y
          node scripts/verify-package.ts --asar "$RUNNER_TEMP/app/resources/app.asar"
      - name: Checksum
        working-directory: apps/desktop/release
        # Node, not shasum/sha256sum: the same tool and output format (`<hex>  <name>`) on all runners.
        run: >-
          node -e "const f=process.argv[1];const h=require('crypto').createHash('sha256').update(require('fs').readFileSync(f)).digest('hex');require('fs').writeFileSync(f+'.sha256',h+'  '+f+'\\n')" "${{ matrix.out }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "${{ matrix.id }}", path: "apps/desktop/release/${{ matrix.out }}*", retention-days: 7, if-no-files-found: error }

  release:                                  # one job creates ONE draft (no 3-way race)
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        # dist/Tovu-windows-x64-setup.exe now exists — the win-x64 matrix row builds it and
        # electron-builder.yml's nsis.artifactName names it exactly this.
        # A re-run may refresh a DRAFT's assets, never a published release's: those are what the
        # stable `releases/latest/download/...` URLs already serve.
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          assets=(dist/Tovu-mac-arm64.dmg dist/Tovu-mac-x64.dmg dist/Tovu-windows-x64-setup.exe dist/SHA256SUMS.txt)
          if draft="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            test "$draft" = "true" || { echo "release $TAG is already published; refusing to replace its assets"; exit 1; }
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Tovu Desktop ${TAG#desktop-v}" \
              --notes "Mac: notarized. Windows: unsigned — SmartScreen: More info → Run anyway." \
              "${assets[@]}"
          fi
