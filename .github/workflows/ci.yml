name: CI

# SPEC-022 REQ-11/REQ-12 named `check:boundaries` and `check:inventory` as scripts written for
# "whoever stands up CI later to wire in as-is" (see .dependency-cruiser.cjs and
# development/scripts/check-capability-inventory.ts) — this workflow is that wiring. Kept intentionally small
# per this repo's Constitution Simplicity Gate: one job, one OS, one Node version, no matrix.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # BLOCKER 1 fix (see ADS-memory/reports/external-audit/runs/2026-08-12-five-auditor-postgres-manifest-audit.md):
    # src/db/__tests__/migration-manifest-postgres.test.ts proves Postgres semantics against a real
    # server via src/db/migration/pg-fixture.ts (`psql` shell-out — see that file's header for why).
    # It is deliberately fail-closed, not skip-if-absent: an auditor stripped `psql` from PATH and
    # confirmed 5/5 tests fail, 0 skip. That means a Postgres server MUST exist wherever `npm test`
    # runs, or CI fails for the right reason but every PR is red. This service container is that
    # server — GitHub-hosted `ubuntu-latest` runners are ephemeral (fresh container per job), so there
    # is no persistent/shared database `recreateDatabase()`'s `DROP DATABASE IF EXISTS` could ever
    # collide with. That ephemerality guarantee does NOT extend to self-hosted, non-ephemeral runners;
    # if this workflow is ever moved to one, concurrent runs sharing one long-lived Postgres could drop
    # each other's fixture database and this section needs revisiting.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # GitHub Actions blocks job steps from starting until this health check passes, so the "Test"
        # step below never races an unready server. Syntax matches GitHub's documented example
        # verbatim (docs.github.com → Creating PostgreSQL service containers).
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Test
        # PGHOST/PGPORT/PGUSER/PGPASSWORD are libpq's standard env var names; src/db/migration/pg-fixture.ts
        # reads the first three (PGPASSWORD flows to `psql` automatically via inherited process env) and
        # falls back to the `/tmp` socket + role `la` used by local development when they're unset. Setting
        # them only on this step, pointed at the `postgres` service container above, is what turns BLOCKER 1
        # from "fails for the right reason with no way to pass" into an actual test run.
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm test

      - name: Check architecture boundaries
        # .dependency-cruiser.cjs rules are deliberately severity:"warn" (see file header) —
        # this always exits 0 on ordinary violations by design, so no continue-on-error needed.
        # It only fails the step if the tool itself errors out.
        run: npm run check:boundaries

      - name: Check architecture metrics
        # BLOCKING, unlike check:boundaries above — and a genuinely different check.
        #
        # dependency-cruiser's `no-circular` finds cycles between *files*; this repo has 2 of
        # those. It cannot express cycles between *modules* (`src/<dir>`), of which there are
        # dozens, and those are the ones that decide whether a module can ever be extracted into
        # its own package — nor any of the other structural questions (change propagation, imports
        # into the composition root, enforced module APIs, core-vs-periphery blast radius) that
        # decide the same thing. This step ratchets six such metrics against a committed baseline:
        # it fails only when one gets WORSE than the baseline, so it can be blocking from day one
        # while the existing violations are worked down. See development/scripts/check-architecture.ts.
        run: npm run check:architecture

      - name: Check capability-inventory staleness
        # Same report-only posture as check:boundaries (see development/scripts/check-capability-inventory.ts
        # header) — always exits 0 on findings, only fails on a genuine script error.
        run: npm run check:inventory

      - name: Lint
        # No lint tool existed in this repo before this workflow. Added Biome (single
        # dependency-light binary, off-the-shelf "recommended" preset — not a bespoke ruleset)
        # covering src/**/*.ts and apps/admin/src/**/*.{ts,tsx}. A first-time lint pass over this
        # previously-unlinted codebase surfaces ~130 pre-existing findings (mostly
        # lint/style/noNonNullAssertion and lint/a11y/useButtonType) that are out of scope to
        # mass-fix here, especially with other work concurrently in flight across the tree.
        # Non-blocking for now, same posture as check:boundaries/check:inventory above, until a
        # follow-up task triages the existing findings and this can flip to blocking.
        run: npm run lint
        continue-on-error: true

      - name: Architecture boundaries (ESLint)
        # BLOCKING, unlike the Biome step above, and deliberately a separate step
        # rather than folded into it.
        #
        # `npm run lint` is Biome only and is non-blocking while ~130 pre-existing
        # findings are triaged. ESLint was therefore running nowhere in CI, which
        # made ADR-051's claim that a stray `@tanstack/*` import "fails lint"
        # true only for whoever happened to run `npm run complexity` by hand — an
        # enforcement guarantee that did not, in fact, enforce anything. Caught by
        # external review, not by us.
        #
        # Safe to block because the config's only `error`-level rule is that
        # import boundary; `complexity`/`sonarjs` are `warn` and do not affect the
        # exit code. Verified: the command exits 0 against the tree as it stands,
        # so this step fails only on a genuine boundary violation.
        run: npm run complexity

      - name: Install admin dependencies
        run: npm ci --prefix apps/admin

      - name: Typecheck (admin)
        run: npm --prefix apps/admin run typecheck

      - name: Build admin
        run: npm run admin:build
