name: CI

# SPEC-022 REQ-11/REQ-12 named `check:boundaries` and `check:inventory` as scripts written for
# "whoever stands up CI later to wire in as-is" (see .dependency-cruiser.mjs and
# development/scripts/check-capability-inventory.ts) — this workflow is that wiring. Kept
# intentionally small per this repo's Constitution Simplicity Gate: one OS, one Node version, no
# matrix (two jobs as of 2026-08-16, `build-and-test` + `route-coverage`, run in parallel — see
# `route-coverage`'s own header comment for why that split exists).
#
# 2026-08-16: this workflow had NEVER fired for `general-work` before tonight -- triggers only
# named `main`, and `general-work` was 38+ commits ahead with zero CI runs on any of them,
# including everything else in this file. Fixed below: `push` now watches every branch (so no
# future branch is silently unwatched the same way), and `pull_request` explicitly names both
# long-lived integration branches this repo actually uses.
#
# 2026-08-31 (`daa74a65`): the `@jini-ai/*` dependencies in package.json, apps/admin/package.json,
# and apps/site-chat/package.json moved from `file:../Jini/packages/*` sibling-checkout links to
# published npm registry semver ranges (verified: zero `file:` specifiers remain in any of the
# three manifests or lockfiles). Every job below now installs them exactly like any other
# dependency, via `npm ci` against the registry -- no sibling Jini checkout, no `pnpm`, no separate
# build step. This workflow used to clone and build a sibling `Jini/` checkout before every
# `npm ci` to satisfy the old `file:` links; that machinery (and the `pnpm/action-setup@v4` step it
# required, since Jini alone used pnpm) is gone as of this commit. See this file's git history from
# before 2026-09 if the old sibling-checkout mechanics are ever needed for reference.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, general-work]

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # BLOCKER 1 fix (see ADS-memory/reports/external-audit/runs/2026-08-12-five-auditor-postgres-manifest-audit.md):
    # src/platform/db/__tests__/migration-manifest-postgres.test.ts proves Postgres semantics against a real
    # server via src/platform/db/migration/pg-fixture.ts (`psql` shell-out — see that file's header for why).
    # It is deliberately fail-closed, not skip-if-absent: an auditor stripped `psql` from PATH and
    # confirmed 5/5 tests fail, 0 skip. That means a Postgres server MUST exist wherever `npm test`
    # runs, or CI fails for the right reason but every PR is red. This service container is that
    # server — GitHub-hosted `ubuntu-latest` runners are ephemeral (fresh container per job), so there
    # is no persistent/shared database `recreateDatabase()`'s `DROP DATABASE IF EXISTS` could ever
    # collide with. That ephemerality guarantee does NOT extend to self-hosted, non-ephemeral runners;
    # if this workflow is ever moved to one, concurrent runs sharing one long-lived Postgres could drop
    # each other's fixture database and this section needs revisiting.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # GitHub Actions blocks job steps from starting until this health check passes, so the "Test"
        # step below never races an unready server. Syntax matches GitHub's documented example
        # verbatim (docs.github.com → Creating PostgreSQL service containers).
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # NO TOKEN OR SECRET IS NEEDED TO CLONE AINSEP/Jini -- it is a PUBLIC repository.
      #
      # An earlier revision of this file carried a `Guard - JINI_CHECKOUT_TOKEN must be set` step
      # here that hard-failed the build when that secret was absent, on the stated-as-verified claim
      # that AINSEP/Jini is private. That claim was FALSE: `gh api repos/AINSEP/Jini --jq '.private'`
      # returns `false` (i.e. NOT private) and was misread as confirming private. Re-verified with no
      # authentication at all on 2026-08-16:
      #   curl https://api.github.com/repos/AINSEP/Jini                            -> HTTP 200
      #   curl https://github.com/AINSEP/Jini.git/info/refs?service=git-upload-pack -> HTTP 200
      #   git ls-remote https://github.com/AINSEP/Jini.git general-work            -> 31500c90...
      # Anonymous clone works. The guard would have failed every run for a secret nobody needs.
      #
      # Do not re-add a `token:` to the Jini checkout below. Passing one would make a future reader
      # infer that credentials are required here, which is exactly how the wrong claim propagated the
      # first time.

      - name: Resolve matching Jini branch
        id: jini-ref
        # Tovu and Jini are developed in lockstep on same-named branches (both `general-work`
        # tonight), not against Jini's `main`. Falls back to Jini's `main` if no branch of the same
        # name exists there. The unconditional `git ls-remote ... HEAD` first is the load-bearing
        # part: `set -e` makes a bad/expired token (or no repo access) fail this step immediately and
        # loudly, rather than silently falling through to "branch not found, use main" -- those are
        # very different problems and must not look the same.
        run: |
          set -euo pipefail
          REMOTE="https://github.com/AINSEP/Jini.git"   # public repo -- no credentials needed
          git ls-remote "$REMOTE" HEAD >/dev/null
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --heads "$REMOTE" "$BRANCH" | grep -q .; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "::notice::No Jini branch named '$BRANCH' -- falling back to Jini's main."
          fi

      - name: Clone Jini (sibling dependency)
        # Tovu's package.json has 13 "@jini-ai/*": "file:../Jini/packages/*" dependencies, resolved
        # via a literal sibling directory on disk -- not a registry, not a git submodule. A fresh CI
        # checkout has no such directory, so every @jini-ai/* import is unresolvable and typecheck
        # collapses (verified against a real run, 31558848242 on 2026-08-12: dies at
        # `error TS2307: Cannot find module '@jini-ai/cms/core'`, then a wall of downstream
        # implicit-any noise from the same root cause -- this has failed on `main` every run since
        # 2026-08-04).
        #
        # `git clone` in a `run:` step, NOT actions/checkout: that action hard-refuses any `path:`
        # outside $GITHUB_WORKSPACE and fails the run in ~37s with
        #   Repository path '/home/runner/work/Tovu-AI-CMS/Jini' is not under
        #   '/home/runner/work/Tovu-AI-CMS/Tovu-AI-CMS'
        # (observed for real, run 31995253883). `run:` steps carry no such containment restriction.
        # `$GITHUB_WORKSPACE/../Jini` is the TRUE sibling path `file:../Jini/packages/*` expects.
        # No credentials: AINSEP/Jini is public (see the note above). --depth 1 because nothing here
        # reads Jini's history; only its built dist/.
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.jini-ref.outputs.ref }}" \
            https://github.com/AINSEP/Jini.git "$GITHUB_WORKSPACE/../Jini"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          # No version pin: reads the `packageManager` field (pnpm@10.33.2) from Jini's OWN
          # package.json instead. `package_json_file` is resolved as `path.join($GITHUB_WORKSPACE,
          # <this value>)` by the action itself (verified against pnpm/action-setup@v4's own
          # dist/index.js, `readTarget()`) -- a plain path.join+readFileSync with no
          # workspace-containment check, unlike actions/checkout, so `../Jini/package.json` is legal
          # here even though it wasn't for the checkout step above.
          #
          # Without this, the action defaults to `package_json_file: package.json`, which resolves
          # to *Tovu's own* root package.json (Tovu is the primary checkout, at $GITHUB_WORKSPACE) --
          # not Jini's. Tovu has no `packageManager` field (its root uses npm, not pnpm; see the
          # `npm ci` / `npm run typecheck` steps below). Traced through the action's source: with no
          # `version:` input and no `packageManager` field found, it throws "No pnpm version is
          # specified" and the step fails outright. This was NEVER caught by a real run -- the prior
          # revision's `git clone` fix (af5af566) only got as far as removing the checkout-path
          # blocker; this step was still unreached.
          package_json_file: ../Jini/package.json

      - name: Build Jini (siblings resolve through gitignored dist/, not source)
        # Every Jini package's package.json resolves its own @jini-ai/* siblings through its
        # gitignored dist/ (types/main both point there) -- a fresh checkout has no dist/ at all, so
        # Tovu's install/typecheck fails without building Jini first. Verified this is exactly what
        # Jini's own ci.yml does before its own typecheck step, for the identical reason.
        run: |
          cd ../Jini
          pnpm install --frozen-lockfile
          pnpm -r run build

      - name: Install root dependencies
        run: npm ci

      # ---------------------------------------------------------------------------------------
      # GATES BELOW ARE `continue-on-error: true` + `id:` ON PURPOSE (2026-08-19). They are NOT
      # non-blocking: the "Gate summary" step at the end of this job reads every outcome and fails
      # the job if any of them failed. The change is WHEN you learn, not WHETHER it blocks.
      #
      # Why: GitHub halts a job at the first failed step, so a run reported exactly ONE problem
      # even when several existed. With a full run costing ~25 minutes, a session spent most of
      # its time discovering one fact at a time -- fix, push, wait, discover the next. Every gate
      # now runs, and the summary prints the complete picture once.
      #
      # Install/setup steps deliberately do NOT get this treatment: they are prerequisites, not
      # gates. A failed `npm ci` should stop the job immediately rather than running six gates
      # against a broken tree and reporting six meaningless failures.
      # ---------------------------------------------------------------------------------------
      - name: Typecheck (root)
        id: gate-typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Test
        # PGHOST/PGPORT/PGUSER/PGPASSWORD are libpq's standard env var names; src/platform/db/migration/pg-fixture.ts
        # reads the first three (PGPASSWORD flows to `psql` automatically via inherited process env) and
        # falls back to the `/tmp` socket + role `la` used by local development when they're unset. Setting
        # them only on this step, pointed at the `postgres` service container above, is what turns BLOCKER 1
        # from "fails for the right reason with no way to pass" into an actual test run.
        #
        # continue-on-error, DELIBERATELY and NOT quietly: measured 2026-08-16 at 82 pre-existing
        # failures out of 4991 tests (`npm run test:cov`, full src/**+packages/*), independently
        # corroborated by the session's Coordinator as pre-existing debt, not new regressions. This
        # is the FIRST time this workflow has ever run against general-work (see this file's header),
        # so there is no baseline yet to ratchet against for this repo-wide scope, and building one
        # spans other agents' domains (Jini packages, apps/admin-adjacent server code) this task was
        # not scoped to own -- see `route-coverage`'s own Test step below for the narrower scope
        # (src/server/**) that DOES get a real ratchet, because that scope already belongs to this
        # task. This step's own failures are therefore informational only; nothing after it is
        # gated on it succeeding.
        id: test
        continue-on-error: true
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        # TEST_CONCURRENCY (2026-08-19): caps node's test-runner worker fan-out on this
        # runner. Default is os.availableParallelism()-1; each worker is a full process, and
        # liquid-sandbox.test.ts additionally spawns its OWN heap-limited Worker on purpose (it
        # proves the render sandbox's V8 resourceLimits actually fire). On a constrained
        # GitHub runner the sum overshoots available RAM and the kernel kills a SIBLING worker
        # with ERR_WORKER_OUT_OF_MEMORY. A file that dies that way is reported by node as one
        # top-level `not ok N - <file path>`, which check:route-test-baseline can never match
        # against its test-DESCRIPTION-keyed baseline -- so it always prints as a NEW failure and
        # reds the gate for a codebase that is not broken. Diagnosed on runs 32091498514 /
        # 32093877745 (see check-test-baseline.ts "Known limitation: CI-runner file-level
        # crashes") and reproduced again on 32284065315, where all 8 file-path-shaped entries
        # passed clean when re-run individually. Set here rather than in the scripts so local
        # runs keep full parallelism -- the npm scripts add the flag only when this var is set.
          TEST_CONCURRENCY: 2
        # `test:ci`, not `test`: identical suite and globs, but adds a TAP reporter writing
        # development/coverage/test-results-all.tap alongside the usual stdout output. That file is
        # what the report step below reads. `npm test` is left untouched for local use.
        run: npm run test:ci

      # VISIBILITY STEP, not a gate (2026-08-19). The step above has been `continue-on-error` since
      # this workflow was written, on a measured 82 pre-existing repo-wide failures with no baseline
      # to ratchet against -- so for weeks it burned ~13 minutes per run producing a number nobody
      # read and nothing depended on. This step turns that into an actual artifact: the exact list
      # of failing tests, in the precise JSON shape `development/scripts/repo-test-failure-baseline.json`
      # expects, ready to be copied into that file.
      #
      # It is deliberately NOT blocking yet, and neither is the step above. The plan, in order:
      #   1. (this commit) print the real list from a real CI run -- the environment that actually
      #      matters, and the one place the full suite can run without eating a laptop's RAM.
      #   2. commit that list as repo-test-failure-baseline.json.
      #   3. add `npm run check:test-baseline` as a REAL gate alongside the others. From then on any
      #      NEW repo-wide failure fails the build, while the known debt is tolerated AND visible.
      # Step 3 is what makes this a gate; until the baseline exists there is nothing to ratchet
      # against, and a gate with no baseline is just a red build.
      - name: Repo-wide test failure report (informational)
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f development/coverage/test-results-all.tap ]; then
            echo "No TAP output — the Test step did not get far enough to produce one."
            exit 0
          fi
          npx tsx development/scripts/check-test-baseline.ts \
            --capture /tmp/repo-test-failure-baseline.json \
            development/coverage/test-results-all.tap
          echo ""
          echo "===== COPY THE BLOCK BELOW INTO development/scripts/repo-test-failure-baseline.json ====="
          cat /tmp/repo-test-failure-baseline.json
          echo "===== END ====="

      - name: Check architecture boundaries
        # .dependency-cruiser.mjs rules are deliberately severity:"warn" (see file header) —
        # this always exits 0 on ordinary violations by design, so no continue-on-error needed.
        # It only fails the step if the tool itself errors out.
        id: gate-boundaries
        continue-on-error: true
        run: npm run check:boundaries

      - name: Check architecture metrics
        # BLOCKING, unlike check:boundaries above — and a genuinely different check.
        #
        # dependency-cruiser's `no-circular` finds cycles between *files*; this repo has 2 of
        # those. It cannot express cycles between *modules* (`src/<dir>`), of which there are
        # dozens, and those are the ones that decide whether a module can ever be extracted into
        # its own package — nor any of the other structural questions (change propagation, imports
        # into the composition root, enforced module APIs, core-vs-periphery blast radius) that
        # decide the same thing. This step ratchets six such metrics against a committed baseline:
        # it fails only when one gets WORSE than the baseline, so it can be blocking from day one
        # while the existing violations are worked down. See development/scripts/check-architecture.ts.
        id: gate-architecture
        continue-on-error: true
        run: npm run check:architecture

      - name: Check capability-inventory staleness
        # Same report-only posture as check:boundaries (see development/scripts/check-capability-inventory.ts
        # header) — always exits 0 on findings, only fails on a genuine script error.
        id: gate-inventory
        continue-on-error: true
        run: npm run check:inventory

      - name: Check src/server/routes complexity drift
        # Requested by src-complexity-gate, wired in here (that agent owns package.json scripts,
        # not workflows). Same ratchet shape as check:architecture above: blocking, fails only when
        # a NEW violation appears that isn't already in the committed baseline
        # (development/scripts/src-complexity-debt.json — 115 violations / 72 files as of
        # 2026-08-16). Plain `tsx`, no dependency on any earlier step's output, so it's safe here or
        # run standalone. Scope is deliberately `src/server/routes/**` only, NOT all of `src/` — every
        # number in the baseline came from an audit that only measured route files; there is no
        # `src/`-wide measurement to ratchet against. Verified locally before wiring in: `npm run
        # check:src-complexity-drift` exits 0, "0 new complexity violations (115 total, 115 in
        # baseline)".
        id: gate-src-complexity
        continue-on-error: true
        run: npm run check:src-complexity-drift

      - name: Check seed-content drift
        # Added 2026-08-21 (Sol audit finding, MEDIUM): development/scripts/ci-local.sh has run
        # this gate since 2026-08-21 but this workflow never did — 0 occurrences before this
        # commit. Same report-only-on-genuine-drift posture as the other `tsx`-run checks above:
        # `generate-seed-content.ts --check` exits 0 when src/templates/starter/seed-content.json
        # already matches what src/server/seed.ts generates, and exits 1 (this step then fails,
        # caught by the Gate summary step) on drift. Not a ratchet — there is no tolerated debt
        # here, the two files must always match exactly.
        #
        # Why this exists: seed-content.json was hand-synced against seed.ts before the generator
        # did, and drifted twice in a single day — `0f0de930` (2026-08-19) fixed a drift, then
        # `8c7effea`, hours later the same day, re-broke it. See generate-seed-content.ts's own
        # header for the full incident. Command name verified against package.json's
        # `check:seed-content-drift` script (`tsx development/scripts/generate-seed-content.ts
        # --check`) and confirmed locally: exits 0, "seed-content.json is up to date with seed.ts".
        #
        # UNVALIDATED against a live GitHub Actions run — Actions is billing-blocked on this repo
        # (see ci-local.sh's own header), so this step has only been checked by parsing the YAML
        # and running the underlying npm script locally, not by an actual CI execution.
        id: gate-seed-content-drift
        continue-on-error: true
        run: npm run check:seed-content-drift

      - name: Check coverage-integrity
        # Added 2026-09-03 (CI gate wiring audit) — this script existed and passed locally the
        # whole time but was never referenced by any workflow. Verified non-vacuous before
        # wiring: `npm run check:coverage-integrity` evaluates 799 first-party test blocks (470
        # non-first-party skipped) and reports 0 dual-instantiation contamination on this branch.
        # Same blocking-via-summary posture as the other `tsx`-run gates above.
        id: gate-coverage-integrity
        continue-on-error: true
        run: npm run check:coverage-integrity

      - name: Check seal-aad invariant
        # Added 2026-09-03 (CI gate wiring audit) — same "written but never wired" state as
        # check:coverage-integrity above. Verified non-vacuous: independently grepped 36
        # `.seal(` call sites across 13 files under apps/website/src before wiring; the script
        # itself confirms every one supplies `aad`. Do not edit
        # apps/website/src/features/webhooks/seal-aad-invariant.ts from this workflow file —
        # it is owned elsewhere this session.
        id: gate-seal-aad
        continue-on-error: true
        run: npm run check:seal-aad

      - name: Check default-credential exposure
        # Added 2026-09-03 (CI gate wiring audit) — same "written but never wired" state.
        # Scope is apps/admin/src (851 files, confirmed non-empty before wiring) per the
        # script's own header. Do not edit
        # apps/website/src/features/identity/default-credential-exposure.ts from this workflow
        # file — it is owned elsewhere this session.
        id: gate-default-credential
        continue-on-error: true
        run: npm run check:default-credential

      - name: Lint
        # No lint tool existed in this repo before this workflow. Added Biome (single
        # dependency-light binary, off-the-shelf "recommended" preset — not a bespoke ruleset)
        # covering src/**/*.ts and apps/admin/src/**/*.{ts,tsx}. A first-time lint pass over this
        # previously-unlinted codebase surfaces ~130 pre-existing findings (mostly
        # lint/style/noNonNullAssertion and lint/a11y/useButtonType) that are out of scope to
        # mass-fix here, especially with other work concurrently in flight across the tree.
        # Non-blocking for now, same posture as check:boundaries/check:inventory above, until a
        # follow-up task triages the existing findings and this can flip to blocking.
        run: npm run lint
        continue-on-error: true

      - name: Architecture boundaries (ESLint)
        # BLOCKING, unlike the Biome step above, and deliberately a separate step
        # rather than folded into it.
        #
        # `npm run lint` is Biome only and is non-blocking while ~130 pre-existing
        # findings are triaged. ESLint was therefore running nowhere in CI, which
        # made ADR-051's claim that a stray `@tanstack/*` import "fails lint"
        # true only for whoever happened to run `npm run complexity` by hand — an
        # enforcement guarantee that did not, in fact, enforce anything. Caught by
        # external review, not by us.
        #
        # Safe to block because the config's only `error`-level rule is that
        # import boundary; `complexity`/`sonarjs` are `warn` and do not affect the
        # exit code. Verified: the command exits 0 against the tree as it stands,
        # so this step fails only on a genuine boundary violation.
        id: gate-eslint-boundaries
        continue-on-error: true
        run: npm run complexity

      - name: Install admin dependencies
        run: npm ci --prefix apps/admin

      - name: Typecheck (admin)
        id: gate-admin-typecheck
        continue-on-error: true
        run: npm --prefix apps/admin run typecheck

      - name: Build admin
        id: gate-admin-build
        continue-on-error: true
        run: npm run admin:build

      # THIS is what makes this job blocking. Every gate above is `continue-on-error: true` so all
      # of them get to run; this step reads their recorded outcomes and fails the job if any of
      # them failed. `if: always()` so it still runs after a gate failure -- without it, this step
      # would be skipped and a red job would report green.
      - name: Gate summary (build-and-test)
        if: always()
        run: |
          fail=0
          skipped=0
          # SKIP is reported distinctly from FAIL on purpose. Both fail the job — a gate that never
          # ran has NOT been shown to pass — but calling a skipped gate "FAIL" is a lie that costs
          # real debugging time. Learned the hard way on run 32292815327: one non-gate step halted
          # the job, five gates never executed, and the summary reported all five as FAIL. The
          # fix for the halt itself is that every non-setup step is now continue-on-error, so this
          # branch should be unreachable; it stays as the honest fallback if a step ever dies in a
          # way continue-on-error cannot catch (runner OOM, cancellation, a `uses:` action fault).
          check () { # $1 = outcome, $2 = human label
            case "$1" in
              success) printf '  PASS  %s\n' "$2" ;;
              skipped) printf '  SKIP  %s  (did not run — an earlier step halted the job)\n' "$2"; skipped=1; fail=1 ;;
              *)       printf '  FAIL  %s\n' "$2"; fail=1 ;;
            esac
          }
          echo "--- build-and-test gates ---"
          check "${{ steps.gate-typecheck.outcome }}"          "typecheck (root)"
          check "${{ steps.gate-boundaries.outcome }}"         "check:boundaries (dependency-cruiser)"
          check "${{ steps.gate-architecture.outcome }}"       "check:architecture"
          check "${{ steps.gate-inventory.outcome }}"          "check:inventory"
          check "${{ steps.gate-src-complexity.outcome }}"     "check:src-complexity-drift"
          check "${{ steps.gate-seed-content-drift.outcome }}" "check:seed-content-drift"
          check "${{ steps.gate-coverage-integrity.outcome }}" "check:coverage-integrity"
          check "${{ steps.gate-seal-aad.outcome }}"           "check:seal-aad"
          check "${{ steps.gate-default-credential.outcome }}" "check:default-credential"
          check "${{ steps.gate-eslint-boundaries.outcome }}"  "complexity (ESLint import boundaries)"
          check "${{ steps.gate-admin-typecheck.outcome }}"    "typecheck (admin)"
          check "${{ steps.gate-admin-build.outcome }}"        "admin:build"
          echo "---"
          if [ "$fail" -ne 0 ]; then
            echo "One or more gates failed. Scroll up: EVERY failing gate above has its own full log," >&2
            echo "so this run reports all of them at once rather than only the first." >&2
            if [ "$skipped" -ne 0 ]; then
              echo "NOTE: gates marked SKIP never executed. Fix the halting step first, then re-read" >&2
              echo "this summary — their real status is still unknown." >&2
            fi
            exit 1
          fi
          echo "All build-and-test gates passed."

  route-coverage:
    # Deliberately a SEPARATE job, not a step tacked onto build-and-test above, so it runs in
    # parallel and this repo's wall-clock CI time is max(build-and-test, route-coverage) rather
    # than their sum. `npm run test:cov` (full src/** + packages/*, 4991 tests) was measured at
    # 18.5 minutes on 2026-08-16 -- unacceptable to add to the critical path of every push. This
    # job instead runs `test:cov:server`, scoped to src/server/**/*.test.ts only (the audit's own
    # measurement command, ~7 minutes): every test that can exercise src/server/routes/** lives
    # under src/server/**, so the two gates below lose no real signal from the narrower scope, and
    # none of those tests need the Postgres service container build-and-test uses (verified: no
    # src/server test references psql/pg-fixture/PGHOST) so this job skips that setup entirely.
    #
    # 2026-08-18: the "Route tests + coverage (tiered ...)" step below runs the same src/server
    # suite two MORE times (split unit-only / integration-only, for the two-tier diff gate) on top
    # of the combined run above (kept for the floor gate) -- accepted extra wall-clock cost for this
    # job specifically, per this task's own scoping ("the floor gate is not the target of this
    # redesign, use judgment, simplest is leaving it on the old combined lcov.info"); the
    # integration-only run is small (12 files), the unit-only run is close to the combined run's own
    # length since most tests are unit. If this job's wall-clock time becomes the bottleneck later,
    # the fix is a real lcov merge (summing hit counts per line/branch across the two partial runs)
    # so the floor gate can read `test:cov:server:tiered`'s output instead of a third full run --
    # not attempted here since it needs the `lcov` CLI (or equivalent merge logic), not just Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: check-route-coverage-diff.ts needs a real
          # `git merge-base` against the PR's base branch to know which route files changed. A
          # shallow clone would make that resolution fail outright (the gate exits non-zero rather
          # than silently passing -- see check-route-coverage-diff.ts's own error message).
          fetch-depth: 0

      # This job also runs `npm ci` at the repo root, which needs the same 13 file:../Jini/packages/*
      # deps resolved as build-and-test does -- see that job's identically-commented steps for the
      # full reasoning (public cross-org repo, gitignored dist/, branch pairing). Duplicated here
      # rather than factored into a composite action/reusable workflow: two short step sequences are
      # easier to read top-to-bottom than an extra indirection layer, matching this file's own
      # existing Simplicity Gate note.
      # No token needed -- AINSEP/Jini is PUBLIC. See build-and-test's note on this.

      - name: Resolve matching Jini branch
        id: jini-ref
        run: |
          set -euo pipefail
          REMOTE="https://github.com/AINSEP/Jini.git"   # public repo -- no credentials needed
          git ls-remote "$REMOTE" HEAD >/dev/null
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --heads "$REMOTE" "$BRANCH" | grep -q .; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "::notice::No Jini branch named '$BRANCH' -- falling back to Jini's main."
          fi

      - name: Clone Jini (sibling dependency)
        # `git clone`, not actions/checkout -- see build-and-test's identically-named step for why
        # (actions/checkout refuses any path outside $GITHUB_WORKSPACE; verified, run 31995253883).
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.jini-ref.outputs.ref }}" \
            https://github.com/AINSEP/Jini.git "$GITHUB_WORKSPACE/../Jini"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          # Same fix as build-and-test's identically-named step -- see its comment for why this is
          # required (not optional/defensive): without it, this step throws "No pnpm version is
          # specified" because $GITHUB_WORKSPACE/package.json (Tovu's) has no `packageManager` field.
          package_json_file: ../Jini/package.json

      - name: Build Jini (siblings resolve through gitignored dist/, not source)
        run: |
          cd ../Jini
          pnpm install --frozen-lockfile
          pnpm -r run build

      - name: Install root dependencies
        run: npm ci

      - name: Route tests + coverage (src/server-scoped)
        # Writes development/coverage/lcov.info AND development/coverage/test-results.tap in the
        # same run (three simultaneous --test-reporter pairs -- see test:cov:server's own command).
        #
        # continue-on-error, DELIBERATELY and NOT quietly, same reasoning as build-and-test's Test
        # step: this is the first time this workflow has ever run against general-work (see this
        # file's header), so `npm run test:cov:server` is red on arrival -- 28 pre-existing failures
        # under src/server/**, independently verified by the session's Coordinator against an
        # isolated worktree at session start (byte-identical failing test names, zero new). UNLIKE
        # build-and-test's Test step, this one IS backed by a real ratchet below (this scope already
        # belongs to this task) -- the three steps after this one are the actual gates; this step
        # existing only to produce their input files.
        id: route-tests
        continue-on-error: true
        env:
          TEST_CONCURRENCY: 2
        run: npm run test:cov:server

      - name: Route tests + coverage (tiered -- unit vs integration)
        # 2026-08-18 two-tier redesign: `test:cov:server` above writes ONE combined lcov.info, which
        # cannot tell a route file's unit branch coverage apart from its integration branch coverage
        # -- exactly the gap that let a pure import-redirect push trip the old single-80%-number diff
        # gate on pre-existing debt it couldn't see the shape of (see check-route-coverage-diff.ts's
        # header, "Two-tier redesign"). This step runs the src/server test suite TWICE more, split by
        # `route-coverage-lib.ts`'s `isIntegrationTestFile` convention, writing
        # development/coverage/lcov.unit.info and lcov.integration.info -- inputs the diff gate below
        # now reads instead of the combined file. Does NOT touch development/coverage/lcov.info or
        # test-results.tap (the floor gate and test-failure-baseline step below still read those,
        # produced by the step above) -- test:cov:server:unit/integration deliberately `rm -f` only
        # their own output file, not the whole development/coverage/ directory.
        #
        # continue-on-error, same reasoning as the step above: the real gates are the explicit checks
        # after this one, and this step exists only to produce their input files.
        id: route-tests-tiered
        continue-on-error: true
        env:
          TEST_CONCURRENCY: 2
        run: npm run test:cov:server:tiered

      - name: Check route coverage floor
        # src/server/routes/** aggregate must not backslide below the 2026-08-16 baseline (minus
        # margin) — see development/scripts/check-route-coverage-floor.ts's header for the exact
        # thresholds and where they came from. Unchanged by the 2026-08-18 two-tier redesign below —
        # still reads the combined development/coverage/lcov.info from the step above.
        id: gate-coverage-floor
        continue-on-error: true
        run: npm run check:route-coverage-floor

      - name: Check route coverage diff
        # Every new/modified route file must individually clear BOTH: unit branch coverage >= 99%
        # AND integration branch coverage >= 95% (2026-08-18 two-tier redesign, replacing the
        # original single 80%-branch bar — see development/scripts/check-route-coverage-diff.ts's
        # header, "Two-tier redesign", for why one combined number wasn't enough). Reads
        # development/coverage/lcov.unit.info and lcov.integration.info, written by the tiered step
        # above. GITHUB_BASE_REF is set automatically on pull_request events. GITHUB_EVENT_BEFORE
        # (2026-08-17 fix) covers push events on any branch, diffing against the SHA this push
        # started from rather than a long-diverged `origin/main` — without it, the first real run on
        # `general-work` (a branch weeks ahead of `main`) flagged dozens of longstanding files as
        # "changed", not this push's own diff. See the script's own header for the full incident.
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        id: gate-coverage-diff
        continue-on-error: true
        run: npm run check:route-coverage-diff

      - name: Check route test-failure baseline
        # THE real gate for the "test step is red" problem in this job's scope: fails on any NEW
        # failing test under src/server/** not already in development/scripts/route-test-failure-baseline.json
        # (the 28 known-pre-existing ones), tolerates those. See check-test-baseline.ts's own header
        # for the full reasoning, the ratchet precedent it mirrors (check:admin-complexity-drift,
        # Jini's guard:drift), and its one known limitation (test names, not fully-qualified
        # per-file identities).
        id: gate-test-baseline
        continue-on-error: true
        run: npm run check:route-test-baseline

      # See the identically-purposed step at the end of `build-and-test` for why this exists.
      - name: Gate summary (route-coverage)
        if: always()
        run: |
          fail=0
          skipped=0
          check () { # SKIP vs FAIL distinction: see build-and-test's summary step for why.
            case "$1" in
              success) printf '  PASS  %s\n' "$2" ;;
              skipped) printf '  SKIP  %s  (did not run — an earlier step halted the job)\n' "$2"; skipped=1; fail=1 ;;
              *)       printf '  FAIL  %s\n' "$2"; fail=1 ;;
            esac
          }
          echo "--- route-coverage gates ---"
          check "${{ steps.gate-coverage-floor.outcome }}"  "check:route-coverage-floor"
          check "${{ steps.gate-coverage-diff.outcome }}"   "check:route-coverage-diff"
          check "${{ steps.gate-test-baseline.outcome }}"   "check:route-test-baseline"
          echo "---"
          if [ "$fail" -ne 0 ]; then
            echo "One or more gates failed. Scroll up: EVERY failing gate above has its own full log," >&2
            echo "so this run reports all of them at once rather than only the first." >&2
            exit 1
          fi
          echo "All route-coverage gates passed."
