name: Secrets

# Gitleaks on every push and PR, copied from Jini's `secrets-report` job (owner 2026-10-25: "Git leaks
# also for Tovu"). Scans only the commits the event added, so old history doesn't fail every run;
# a red run means a credential-shaped string landed in THIS push. It does not gate the Fly deploy
# (only jini-published-typecheck does), so a red run is a signal to rotate and rewrite, not a block.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Free CLI, no organization Action license. Verify before extracting/executing.
      # Pin source: https://github.com/gitleaks/gitleaks/releases/expanded_assets/v8.28.0
      - name: Download checksum-pinned Gitleaks CLI
        env:
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          archive="$download_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          install_dir="$RUNNER_TEMP/gitleaks-8.28.0"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Gitleaks scan of this event's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
            log_opts="$BASE_SHA..$HEAD_SHA --full-history -m"
          else
            log_opts="$HEAD_SHA -1"
          fi
          gitleaks git . --config .gitleaks.toml --log-opts="$log_opts" --redact --exit-code=1
