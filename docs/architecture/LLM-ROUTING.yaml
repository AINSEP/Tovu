version: 1
purpose: llm_navigation

canonical_source:
  path: tovu-architecture.md
  role: active_source_of_truth

authority_order:
  - path: tovu-architecture.md
    tier: 1
    role: canonical
  - path: docs/architecture/sections/
    tier: 2
    role: exact_extracts
  - path: docs/architecture/appendices/
    tier: 2
    role: exact_extracts
  - path: docs/architecture/MIGRATION-MAP.yaml
    tier: 3
    role: proof_and_lookup
  - path: docs/architecture/README.md
    tier: 4
    role: human_guidance
  - path: docs/architecture/CONTEXT-PACKET.md
    tier: 4
    role: human_guidance
  - path: docs/architecture/HANDOFF-PROTOCOL.md
    tier: 4
    role: human_guidance
  - path: docs/architecture/LLM-NAVIGATION.md
    tier: 4
    role: guidance_only
  - path: docs/architecture/READING-ORDER.md
    tier: 4
    role: guidance_only
  - path: docs/architecture/CONTEXT-PACKET.yaml
    tier: 5
    role: machine_packet
  - path: docs/architecture/LLM-ROUTING.yaml
    tier: 5
    role: machine_guidance
  - path: docs/architecture/reference/
    tier: 6
    role: background_only

always_include:
  - docs/architecture/sections/00-document-header.md
  - docs/architecture/sections/02-core-design-principle-dependency-inversion-everywhere.md
  - docs/architecture/sections/13-user-friction-coverage-living-backlog.md
  - docs/architecture/sections/14-meta-coding-framework-spec-first-test-first-pattern-first.md

routes:
  architecture_change:
    read:
      - docs/architecture/sections/00-document-header.md
      - docs/architecture/sections/01-architectural-foundation.md
      - docs/architecture/sections/02-core-design-principle-dependency-inversion-everywhere.md
      - docs/architecture/sections/10-dependency-rules.md
      - docs/architecture/sections/11-architecture-enforcement.md
      - docs/architecture/sections/13-user-friction-coverage-living-backlog.md
      - docs/architecture/sections/14-meta-coding-framework-spec-first-test-first-pattern-first.md
  package_layout:
    read:
      - docs/architecture/sections/03-package-structure.md
      - docs/architecture/sections/04-port-interfaces.md
      - docs/architecture/sections/05-the-kernel-ioc-container.md
      - docs/architecture/sections/10-dependency-rules.md
  theme_or_plugin:
    read:
      - docs/architecture/sections/07-theme-engine.md
      - docs/architecture/sections/08-plugin-sdk.md
      - docs/architecture/sections/10-dependency-rules.md
      - docs/architecture/sections/13-user-friction-coverage-living-backlog.md
      - docs/architecture/sections/14-meta-coding-framework-spec-first-test-first-pattern-first.md
  api_or_runtime:
    read:
      - docs/architecture/sections/06-configuration.md
      - docs/architecture/sections/09-api-layer.md
      - docs/architecture/sections/10-dependency-rules.md
  implementation_planning:
    read:
      - docs/architecture/sections/13-user-friction-coverage-living-backlog.md
      - docs/architecture/sections/14-meta-coding-framework-spec-first-test-first-pattern-first.md
    note: add the target feature section before planning
  pattern_research:
    read:
      - docs/architecture/appendices/00-architectural-patterns-reference.md
    note: then select the specific appendix file implied by the pattern name

update_workflow:
  - edit: tovu-architecture.md
  - verify: scripts/verify-architecture-split.sh
  - refresh_hub: docs/architecture/README.md
  - refresh_packet: docs/architecture/CONTEXT-PACKET.md
  - refresh_handoff: docs/architecture/HANDOFF-PROTOCOL.md
  - refresh_llm_navigation: docs/architecture/LLM-NAVIGATION.md
  - refresh_reading_order: docs/architecture/READING-ORDER.md
  - refresh_machine_packet: docs/architecture/CONTEXT-PACKET.yaml
  - refresh_machine_routing: docs/architecture/LLM-ROUTING.yaml
  - refresh_repo_entrypoints:
      - README.md
      - docs/README.md

anti_patterns:
  - treat_reference_as_canonical
  - hand_edit_extracts_instead_of_root
  - infer_active_commitments_from_appendix_material
  - bypass_section_13_or_14_constraints
