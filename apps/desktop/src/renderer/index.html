<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tovu</title>
    <!--
      This renderer exposes a privileged `window.tovuRunner` bridge (project create/start/stop,
      fleet chat) in a window that runs with `sandbox: false` (see `openSitesHomeWindow` in
      `main.ts`). `script-src 'self'` below means every script this page runs has to ship inside
      the app — nothing may load from a remote origin, so there is no CDN or registry that can
      swap code under this bridge on a release this repo never reviewed.
    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none';" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
