<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Fixed 2026-08-11 (was the same disclosed limitation blog-post.html carried: a static theme's
     <title> being one fixed string per file). Same placeholder `page-shell.html`/`blog-post.html`
     already use — `injectPageTitle` (static-render.ts) substitutes it with the current entity's
     own title before render. Do not echo the literal placeholder tag as prose text anywhere else in
     this file — see that function's own doc for the shadowing bug that caused. -->
<title>{{title}}</title>
<link rel="stylesheet" href="../css/theme.css" />
<script src="../scripts/theme-toggle.js"></script>
</head>
<body>

<div data-embed-config='{"type":"partial","id":"nav","current":"docs"}'></div>

<main>
  <div class="docs-layout wrap">
    <!-- The sidebar is theme markup + CSS; the only thing resolved at request time is the menu
         inside it. `data-embed-config='{"variant":"tree"}'` opts this one marker into nested
         <ul>/<li> rendering (see static-render.ts::renderMenuTree) — the default flat <a> output is
         what every other marker in this theme still gets, because .main-nav's flex layout depends
         on it. (Marker-spine unification, 2026-08-10: this used to be a bare `data-embed-variant=
         "tree"` attribute, retired in favor of config — see static-render.ts's own file header.)

         `id="docs-current-page-sidebar"` is a RESERVED marker id (2026-08-31 docs-nav restructure,
         `pages.ts`'s `resolveStaticMenusForRender`), not the name of one fixed stored menu: the route
         layer resolves it per request to the menu at slug `docs-<current page's slug>-sidebar`, so
         every page using this template gets its OWN sidebar just by having a menu at that convention
         slug — no template duplication needed to add the next docs page.

         The authored content below is a real fallback, not a placeholder: if that per-page menu does
         not exist yet, or resolves to zero renderable links, this markup is left exactly as-is rather
         than blanked. -->
    <aside class="docs-sidebar">
      <nav class="docs-nav" aria-label="Documentation" data-embed-config='{"type":"menu","id":"docs-current-page-sidebar","variant":"tree"}'>
        <ul class="menu-list depth-0">
          <li class="menu-item depth-0"><span class="menu-item-label">No docs menu bound yet</span></li>
        </ul>
      </nav>
    </aside>

    <article class="docs-content post-detail" data-reveal>
      <div data-embed-config='{"type":"content"}'></div>
    </article>
  </div>
</main>

<div data-embed-config='{"type":"partial","id":"footer"}'></div>

<script src="../scripts/main.js"></script>
<script src="../scripts/vendor/motion.js"></script>
<script src="../scripts/reveal.js"></script>
<script src="../scripts/docs-sidebar.js"></script>
</body>
</html>
