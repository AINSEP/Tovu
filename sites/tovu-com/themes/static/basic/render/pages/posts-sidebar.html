<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/theme-assets/basic/icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/theme-assets/basic/icons/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/theme-assets/basic/icons/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/theme-assets/basic/icons/apple-touch-icon.png" />
<link rel="manifest" href="/theme-assets/basic/manifest.webmanifest" />
<meta name="theme-color" content="#020203" />
<!-- Fixed 2026-08-11 (was the same disclosed limitation posts-default.html carried: a static theme's
     <title> being one fixed string per file). Same placeholder `pages-default.html`/`posts-default.html`
     already use — `injectPageTitle` (static-render.ts) substitutes it with the current entity's
     own title before render. Do not echo the literal placeholder tag as prose text anywhere else in
     this file — see that function's own doc for the shadowing bug that caused. -->
<title>{{title}}</title>
<link rel="stylesheet" href="../css/theme.css" />
<script src="../scripts/theme-toggle.js"></script>
</head>
<body>

<div data-embed-config='{"type":"partial","id":"nav","current":"docs"}'></div>

<main>
  <!-- The ONE docs template every page in the header nav's Docs subtree renders through (2026-09-24
       docs IA restructure). Three grid areas, placed by name (`grid-template-areas` below) so DOM
       order can stay reading-order (sidebar disclosure, TOC disclosure, article) at every width
       instead of fighting a source-order-dependent column layout:

       - `sidebar` — `docs-section` (a RESERVED marker id, `pages.ts`'s `resolveStaticMenusForRender`):
         the header nav's own Docs subtree, groups at depth 0, pages at depth 1, current group/page
         marked via the ordinary `is-active`/`is-current` hooks every tree-variant menu already emits.
         One source with the top-nav flyout and the mobile drawer — see that function's own doc.
       - `content` — the page body, unchanged from before, plus the `docs-prev-next` pager at the
         bottom (also a reserved id, same function).
       - `toc` — "On this page," NOT server-resolved: `docs-toc.js` builds it client-side from this
         page's own `h2[id]`/`h3[id]` (adding ids where missing) and drives its own scroll-spy. There
         is no per-page authored menu for this anymore — see NOTICE.md/this file's own history for the
         retired `docs-current-page-sidebar` convention this replaces.

       Both `.docs-sidebar-toggle` and `.docs-toc-toggle` are real `<details>`, not JS-built: closed
       (collapsible) by default is the correct MOBILE behavior already, and the desktop CSS below
       forcibly keeps them open and hides the `<summary>` toggle — no separate desktop/mobile markup,
       no JS needed to switch modes. -->
  <div class="docs-layout wrap">
    <!-- Mobile: "the disclosure only shows the current group" (docs IA proposal) — theme.css hides
         every `.has-children:not(.is-active)` top-level group at the same breakpoint that collapses
         this into a real disclosure; the full tree is still one tap away via the site's own nav
         drawer (fe79cabce), so this doesn't need to repeat it. -->
    <details class="docs-mobile-toggle docs-sidebar-toggle" open>
      <summary class="docs-mobile-summary">In this section</summary>
      <!-- The authored content below is a real fallback, not a placeholder: if `menu-header-nav` has
           no item resolving to `/docs`, or that item has no children yet, this markup is left
           exactly as-is rather than blanked (see `resolveStaticMenusForRender`'s own doc). -->
      <aside class="docs-sidebar">
        <nav class="docs-nav" aria-label="Documentation" data-embed-config='{"type":"menu","id":"docs-section","variant":"tree"}'>
          <ul class="menu-list depth-0">
            <li class="menu-item depth-0"><span class="menu-item-label">No docs menu bound yet</span></li>
          </ul>
        </nav>
      </aside>
    </details>

    <!-- On this page. Empty until `docs-toc.js` fills it; the script removes this whole `<details>`
         when the page has no `h2`/`h3` to link to, rather than showing an empty disclosure. -->
    <details class="docs-mobile-toggle docs-toc-toggle" open>
      <summary class="docs-mobile-summary">On this page</summary>
      <aside class="docs-toc">
        <nav class="docs-toc-nav" aria-label="On this page"></nav>
      </aside>
    </details>

    <!-- Deliberately no `threshold:` token, and there must never be one again. kUInetic hands
         `threshold:` straight to IntersectionObserver, where it is a fraction of THIS element's OWN
         area, not of the viewport — so anything taller than `viewport / threshold` can never reach it.
         And a deferred (`on:enter`) reveal compiles to `animation-fill-mode: both` +
         `animation-play-state: paused`, which makes `kui-in-up`'s `from { opacity: 0 }` the element's
         RESTING style until the observer fires: an unsatisfiable threshold does not merely skip the
         animation, it leaves the whole page body permanently invisible. This wrapper holds author
         content, so its height is unbounded and 0 (an unset threshold) is the only value that is
         satisfiable at every height. See NOTICE.md, "Why the page wrappers carry no threshold:". -->
    <article class="docs-content post-detail" data-kui="fade-up 600ms expo-out distance:18px on:enter">
      <div data-embed-config='{"type":"content"}'></div>

      <!-- Previous/Next, crossing group boundaries — `docs-prev-next` (reserved id, same function as
           `docs-section` above) resolves 0-2 synthetic items tagged `docs-pager-prev`/`docs-pager-next`
           via `attrs.cssClass`, which the tree renderer already passes through onto each `<li>`.
           Empty (no items) on the Docs landing page itself or a page with no neighbour on one side —
           theme.css hides an empty `.docs-pager` entirely rather than showing an empty bar. -->
      <nav class="docs-pager" aria-label="Previous and next page" data-embed-config='{"type":"menu","id":"docs-prev-next","variant":"tree"}'>
        <ul class="menu-list depth-0"></ul>
      </nav>
    </article>
  </div>
</main>

<div data-embed-config='{"type":"partial","id":"footer"}'></div>

<script src="../scripts/main.js"></script>
<script src="../scripts/docs-toc.js"></script>
<script src="../scripts/vendor/kuinetic.all.js"></script>
<!-- `docs-sidebar.js` (hand-rolled scroll-spy over an AUTHORED per-page anchor menu) retired from
     this template 2026-08-31, superseded first by kUInetic's own scroll-spy and now, as of the
     2026-09-24 docs IA restructure, by `docs-toc.js` above — which owns both building the "On this
     page" list from this page's own headings AND highlighting the current one, so neither
     `docs-sidebar.js` nor a `data-kui="scroll-spy ..."` attribute belongs on this template anymore.
     `docs-sidebar.js` is left on disk (still used by `basic-2`, which does not vendor kuinetic). -->
</body>
</html>
