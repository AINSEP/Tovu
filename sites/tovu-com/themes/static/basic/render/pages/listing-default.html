<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/theme-assets/basic/icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/theme-assets/basic/icons/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/theme-assets/basic/icons/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/theme-assets/basic/icons/apple-touch-icon.png" />
<link rel="manifest" href="/theme-assets/basic/manifest.webmanifest" />
<meta name="theme-color" content="#020203" />
<!-- Same `{{title}}` placeholder contract as pages-default.html/posts-default.html/posts-sidebar.html
     (see those files' own doc for the substitution and the shadowing bug fixed by scoping it) — this
     is a reusable listing template (theme.json `templates`), not one fixed page, so it carries no
     literal title of its own. -->
<title>{{title}}</title>
<link rel="stylesheet" href="../css/theme.css" />
<script src="../scripts/theme-toggle.js"></script>
</head>
<body>

<!-- `current=""`, same as pages-default.html: this template is reusable across any listing page
     (theme.json `templates`), not bound to one nav item. -->
<div data-embed-config='{"type":"partial","id":"nav","current":""}'></div>

<main>
  <!-- The page's own authored content (title/intro via the shared `.post-detail-header`/`-body`
       render — see pages-default.html's own doc on that shared style). Renamed from blog.html's
       hardcoded "The Tovu blog" hero copy (2026-09-03): a reusable template cannot hardcode one
       page's marketing prose, and the content marker already supplies the page's real title. -->
  <!-- Deliberately no `threshold:` token, and there must never be one again. kUInetic hands
       `threshold:` straight to IntersectionObserver, where it is a fraction of THIS element's OWN
       area, not of the viewport — so anything taller than `viewport / threshold` can never reach it.
       And a deferred (`on:enter`) reveal compiles to `animation-fill-mode: both` +
       `animation-play-state: paused`, which makes `kui-in-up`'s `from { opacity: 0 }` the element's
       RESTING style until the observer fires: an unsatisfiable threshold does not merely skip the
       animation, it leaves the whole page body permanently invisible. This wrapper holds author
       content, so its height is unbounded and 0 (an unset threshold) is the only value that is
       satisfiable at every height. See NOTICE.md, "Why the page wrappers carry no threshold:". -->
  <section class="wrap post-detail" data-kui="fade-up 600ms expo-out distance:18px on:enter">
    <div data-embed-config='{"type":"content"}'></div>
  </section>

  <!-- Post-previews marker (2026-09-03, wired here after the mechanism moved off `blog.html` — see
       theme.json `templates`/`/articles`'s own template binding). The fallback below is what shows
       while zero posts are published (today's actual state) or on a theme with the marker not wired
       at all — `injectPostPreviewsEmbeds`'s "no data, authored fallback survives" contract (static-
       render.ts) — so it must stay an honest empty state, never fictional post cards.

       `max-width: 720px` (2026-09-23) matches `.post-detail`'s own column width so this grid lines
       up under the article text above instead of stretching to `.wrap`'s full `--container`
       (1120px) — an inline style on this one wrapper, not a theme.css rule, since only this
       template's `.wrap` needs narrowing and no other page shares it. `.latest-posts` exists only
       so the `.live-example` frame below can be scoped to this template (theme.css) without
       widening `.post-detail-body .live-example`'s existing reach. -->
  <section class="wrap latest-posts" style="max-width: 720px; padding-bottom: 96px;">
    <div class="live-example">
      <section class="blog-grid" data-embed-config='{"type":"post-previews","limit":6}'>
        <p style="color: var(--muted);">No articles published yet.</p>
      </section>
    </div>
  </section>
</main>

<div data-embed-config='{"type":"partial","id":"footer"}'></div>

<script src="../scripts/main.js"></script>
<script src="../scripts/vendor/kuinetic.all.js"></script>
</body>
</html>
