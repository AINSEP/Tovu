env:
  # Non-secret only. Real secrets (TOVU_ADMIN_PASSWORD, TOVU_ADMIN_USER,
  # TOVU_SITE_KEY — see docker-compose.yml's own comments for
  # what each does) go through `fly secrets set`, never in this workflow's env block
  # or the generated [env].
  # The app name is "tovu": the earlier "tovu-ai-cms" returned HTTP 000, while tovu returned HTTP 200.
  FLY_APP: tovu
  FLY_REGION: iad
  # Persistent state: every site's content.db + WAL sidecars, uploads/,
  # themes/, ops state — everything else in the image is disposable. A missing
  # or misconfigured mount here is silent data loss on next deploy, not a
  # startup error. PLACEHOLDER volume name/size — create it first with
  # `fly volumes create tovu_sites --region <region> -a tovu` and match
  # the name in FLY_VOLUME.
  FLY_VOLUME: tovu_sites
  FLY_VOLUME_MOUNT_PATH: /workspace/Tovu/sites
  FLY_DOCKERFILE: Dockerfile
  # `/readyz` exists (apps/website/src/server/inbound/public-http/routes/ops/health.ts,
  # wired via registerReadyzRoute) and is 503 until migrations/seeding finish
  # — a truer "actually ready" signal than `/health`, which is liveness-only.
  FLY_HEALTH_CHECK_PATH: /readyz
  TOVU_RUNTIME_MODE: production
  PORT: "3000"
  # The live site's folder on the `tovu_sites` volume configured above. Pinned 2026-09-26 when the repo's own
  # site folder was renamed `sites/tovu-com` -> `sites/tovu-dev` (which also changed the code default,
  # `DEFAULT_SITE_NAME`): the volume still holds `tovu-com/`, and without this pin the next deploy
  # would boot an empty `tovu-dev/` next to it. To rename the live folder too, stop the machine,
  # `mv /workspace/Tovu/sites/tovu-com /workspace/Tovu/sites/tovu-dev` on the volume, then drop this TOVU_SITE value.
  TOVU_SITE: tovu-com
  TOVU_SITE_ID: ${{ vars.TOVU_SITE_ID }}
  # This deployment's public origin. NOT a secret (it is the URL crawlers already see), so it
  # belongs in this workflow's env block rather than in `fly secrets set`.
  #
  # Load-bearing, added 2026-09-18 — see
  # `ADS-memory/reports/2026-09-18-public-origin-registration-design.md`. This is the ONLY input by
  # which a real public origin can enter the ADR-040 origin registry
  # (`features/origin/configured-origin.ts` reads it at boot;
  # `platform/db/sqlite/origin-repo.sqlite.ts`'s `registerConfiguredOrigin` writes it). With it
  # unset, a production boot registers no origin at all and every public URL degrades to a
  # relative path: `sitemap.xml`'s `<loc>`, `robots.txt`'s `Sitemap:` line, `canonical`, `og:url`,
  # `og:image`, plus newsletter confirm/unsubscribe and member magic links. The sitemap protocol
  # requires absolute `<loc>` values, so leaving this unset is a real (if safe) SEO regression.
  #
  # Setting it also corrects the `http://localhost:3000` row that Fly's FIRST boot durably wrote
  # into this app's `content.db` (the bug `d21d6e7ac` patched defensively on the read side). That
  # correction happens on the next boot after this value is in place — no migration needed.
  #
  # Must be an `https` URL with a non-loopback host, or it is refused with a warning in the boot
  # log and no origin is registered. The same variable already drives OAuth callback URLs and
  # admin deep links, deliberately reused rather than duplicated (ADR-040 names duplicated origin
  # settings as a fracture it exists to close).
  TOVU_PUBLIC_URL: https://tovu.dev
  # Headless Chromium is OFF by default (owner decision 2026-10-08; see the Dockerfile's
  # "Headless Chromium" block for why and what degrades without it). To opt in for browser-backed
  # tools (page evidence, screenshots), set this TOVU_INSTALL_BROWSER value to "1" — or pass
  # `flyctl deploy --build-arg TOVU_INSTALL_BROWSER=1` for a single deploy — and size the machine
  # for ~150–250 MB of extra RAM per capture.
  TOVU_INSTALL_BROWSER: "0"

