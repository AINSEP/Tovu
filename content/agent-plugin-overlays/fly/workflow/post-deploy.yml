
      - name: Wait for site health
        run: curl --fail --silent --show-error --output /dev/null --max-time 5 --retry 30 --retry-delay 5 --retry-all-errors https://tovu.dev/healthz

      # The deploy has already happened; a content regression fails this job as the alert.
      - name: Snapshot and compare HTML after deploy
        run: |
          node development/scripts/deploy-html-snapshot.mjs snapshot https://tovu.dev after.json
          if [[ -f before.json ]]; then
            node development/scripts/deploy-html-snapshot.mjs compare before.json after.json
          else
            echo "::warning::Pre-deploy snapshot unavailable; HTML comparison skipped"
          fi

      - name: Upload deploy HTML snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-html-snapshots
          path: |
            before.json
            after.json
