<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Get started — Tovu</title>
<link rel="stylesheet" href="../css/theme.css" />
<script src="../scripts/theme-toggle.js"></script>
</head>
<body>

<div data-embed-config='{"type":"partial","id":"nav","current":"signup"}'></div>

<main class="auth-wrap" data-reveal>
  <h1>Create your account</h1>
  <p class="lede">Free up to 3 published sites. No card required.</p>

  <form onsubmit="return false;">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Ada Lovelace" required />
    </div>
    <div class="field">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" />
    </div>
    <button type="submit" class="btn btn-solid btn-block btn-lg" style="margin-top: 8px;">Create account</button>
  </form>

  <div class="divider">or</div>
  <button type="button" class="btn btn-ghost btn-block">Continue with GitHub</button>

  <p class="auth-foot">Already have an account? <a href="signin.html">Sign in</a></p>
</main>

<div data-embed-config='{"type":"partial","id":"footer","variant":"minimal"}'></div>

<script src="../scripts/main.js"></script>
<script src="../scripts/vendor/motion.js"></script>
<script src="../scripts/reveal.js"></script>
</body>
</html>
