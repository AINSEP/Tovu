# fly.toml app configuration file generated for tovu on 2026-09-01T02:40:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tovu'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  TOVU_RUNTIME_MODE = 'production'

[[mounts]]
  source = 'tovu_sites'
  destination = '/workspace/Tovu/sites'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
